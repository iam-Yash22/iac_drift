services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VITE_API_URL: ${VITE_API_URL:-http://api:8000}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
